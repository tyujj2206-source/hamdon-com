<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAMDON.COM - PS4 Jailbreak Poops Chain</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  min-height: 100vh;
  background: #05070c;
  color: #e8edf5;
  font: 15px/1.45 "Segoe UI", "Tahoma", system-ui, -apple-system, sans-serif;
  position: relative;
  overflow: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url('logo_raw.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  opacity: 0.92;
  z-index: 0;
  filter: brightness(0.60) contrast(1.08);
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 50% 25%, rgba(127, 208, 160, 0.16), transparent 45%),
    radial-gradient(circle at center, rgba(10, 80, 35, 0.08), rgba(0, 0, 0, 0.58));
  z-index: 0;
  pointer-events: none;
}
#wrap {
  padding: 28px;
  position: relative;
  z-index: 1;
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
#header {
  text-align: center;
  margin-bottom: 26px;
  padding: 30px 24px 28px;
  background: transparent;
  border-radius: 34px;
  border: 1px solid rgba(127, 208, 160, 0.25);
  box-shadow: 0 18px 55px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 0 35px rgba(127, 208, 160, 0.08);
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}
#header::before {
  content: '';
  position: absolute;
  top: 0; left: 12%; right: 12%;
  height: 2px;
  background: linear-gradient(90deg, transparent, #7fd0a0, #b8ffd9, #7fd0a0, transparent);
  box-shadow: 0 0 10px #7fd0a0, 0 0 25px #5fb88a;
  opacity: 0.9;
}
#header h1 {
  font-size: 75px;
  line-height: 1.05;
  font-weight: 900;
  color: #e5fff0;
  margin-bottom: 10px;
  letter-spacing: 1px;
  white-space: nowrap;
  text-shadow: 0 0 5px rgba(190, 255, 220, 1), 0 0 12px rgba(110, 255, 180, 1), 0 0 25px rgba(70, 200, 140, 1), 0 0 45px rgba(30, 160, 100, 0.95), 0 0 80px rgba(20, 120, 70, 0.75);
  animation: neonName 2.5s ease-in-out infinite alternate;
}
@keyframes neonName {
  from { text-shadow: 0 0 5px rgba(180, 255, 210, 0.90), 0 0 12px rgba(100, 240, 170, 0.90), 0 0 25px rgba(60, 200, 130, 0.80), 0 0 45px rgba(30, 160, 90, 0.65), 0 0 75px rgba(20, 120, 60, 0.40); }
  to { text-shadow: 0 0 8px rgba(220, 255, 235, 1), 0 0 18px rgba(130, 255, 195, 1), 0 0 35px rgba(80, 230, 160, 1), 0 0 60px rgba(40, 180, 120, 0.95), 0 0 100px rgba(25, 140, 85, 0.75); }
}
#header .english-name {
  font-family: "Segoe UI", Arial, sans-serif;
  font-size: 32px;
  line-height: 1.05;
  font-weight: 800;
  letter-spacing: 6px;
  color: #a8ffd9;
  margin-top: 8px;
  margin-bottom: 22px;
  text-transform: uppercase;
  text-shadow: 0 0 5px rgba(160, 255, 210, 0.95), 0 0 12px rgba(90, 240, 170, 0.90), 0 0 25px rgba(50, 200, 130, 0.80), 0 0 45px rgba(30, 160, 90, 0.60);
  animation: englishGlow 3s ease-in-out infinite alternate;
}
@keyframes englishGlow {
  from { opacity: 0.82; text-shadow: 0 0 5px rgba(130, 255, 190, 0.70), 0 0 14px rgba(70, 220, 150, 0.65), 0 0 30px rgba(30, 180, 100, 0.45); }
  to { opacity: 1; text-shadow: 0 0 8px rgba(180, 255, 220, 1), 0 0 18px rgba(90, 240, 170, 1), 0 0 35px rgba(50, 200, 130, 0.85), 0 0 60px rgba(30, 160, 90, 0.60); }
}
#header .sub {
  font-size: 27px;
  line-height: 1.25;
  color: #c4ffd9;
  letter-spacing: 1.5px;
  font-weight: 700;
  margin-top: 4px;
  margin-bottom: 24px;
  text-shadow: 0 0 6px rgba(140, 255, 190, 0.85), 0 0 15px rgba(80, 220, 150, 0.75), 0 0 30px rgba(40, 180, 110, 0.55);
}
#header .sub span { color: #d9ffea; font-weight: 800; }
.neon-line {
  width: 72%;
  height: 2px;
  margin: 0 auto 24px;
  background: linear-gradient(90deg, transparent, rgba(127, 208, 160, 0.3), #7fd0a0, rgba(127, 208, 160, 0.3), transparent);
  box-shadow: 0 0 8px rgba(127, 208, 160, 0.8), 0 0 20px rgba(95, 184, 138, 0.45);
}
#header .phone {
  display: inline-block;
  font-size: 22px;
  line-height: 1.1;
  font-weight: 900;
  color: #e5fff0;
  direction: ltr;
  letter-spacing: 3px;
  padding: 10px 24px;
  border-radius: 18px;
  border: 1px solid rgba(127, 208, 160, 0.28);
  background: transparent;
  box-shadow: 0 0 12px rgba(127, 208, 160, 0.45), 0 0 30px rgba(95, 184, 138, 0.35);
  text-shadow: 0 0 5px rgba(170, 255, 210, 1), 0 0 12px rgba(127, 240, 180, 1), 0 0 25px rgba(95, 200, 140, 0.95), 0 0 45px rgba(70, 160, 110, 0.75);
  animation: neonPhone 2s ease-in-out infinite alternate;
}
@keyframes neonPhone {
  from { box-shadow: 0 0 8px rgba(127, 208, 160, 0.35), 0 0 20px rgba(95, 184, 138, 0.25); }
  to { box-shadow: 0 0 15px rgba(127, 208, 160, 0.60), 0 0 35px rgba(95, 184, 138, 0.45), 0 0 60px rgba(70, 160, 110, 0.20); }
}
#state {
  font-size: 22px;
  font-weight: 800;
  margin: 0 0 18px;
  padding: 14px 20px;
  background: transparent;
  border-radius: 22px;
  border: 1px solid rgba(127, 208, 160, 0.16);
  text-shadow: 0 0 10px rgba(127, 208, 160, 0.55);
  text-align: center;
  flex-shrink: 0;
  transition: all 0.3s ease;
}
.loading-wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin-top: 4px;
}
.loader {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 4px solid rgba(255, 255, 255, 0.10);
  border-top-color: #7fd0a0;
  border-right-color: #5fb88a;
  box-shadow: 0 0 10px rgba(127, 208, 160, 0.80), 0 0 25px rgba(95, 184, 138, 0.50);
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loader.done {
  animation: none;
  border: 4px solid #62d99b;
  box-shadow: 0 0 10px rgba(127, 208, 160, 0.85), 0 0 25px rgba(95, 184, 138, 0.55);
}
.loader-dots {
  display: inline-flex;
  gap: 6px;
  margin-left: 8px;
  vertical-align: middle;
}
.loader-dots span {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #7fd0a0;
  box-shadow: 0 0 8px rgba(127, 208, 160, 0.8);
  animation: dot-bounce 1.4s infinite ease-in-out both;
}
.loader-dots span:nth-child(1) { animation-delay: -0.32s; }
.loader-dots span:nth-child(2) { animation-delay: -0.16s; }
.loader-dots span:nth-child(3) { animation-delay: 0s; }
@keyframes dot-bounce {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.35; }
  40% { transform: scale(1.25); opacity: 1; }
}
#out-container {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  left: -99999px;
  top: -99999px;
}
#out {
  white-space: pre-wrap;
  font: 12px/1.45 Consolas, "Courier New", monospace;
  background: rgba(17, 21, 27, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 16px;
  padding: 14px 18px;
  max-height: 300px;
  overflow-y: auto;
  color: #c8ced8;
}
.ok { color: #7fd0a0; }
.bad { color: #f28b82; }
.warn { color: #fdd663; }
.footer {
  position: fixed;
  bottom: 14px;
  right: 22px;
  z-index: 2;
  font-size: 13px;
  color: rgba(127, 208, 160, 0.55);
  letter-spacing: 1px;
  font-weight: 500;
  text-shadow: 0 0 8px rgba(127, 208, 160, 0.45), 0 0 18px rgba(95, 184, 138, 0.30);
}
#state.done {
  color: #7fd0a0;
  border-color: rgba(127, 208, 160, 0.30);
  text-shadow: 0 0 8px rgba(127, 208, 160, 0.70), 0 0 20px rgba(95, 184, 138, 0.45);
}
#state.error {
  color: #f28b82;
  border-color: rgba(240, 100, 90, 0.30);
  text-shadow: 0 0 8px rgba(240, 100, 90, 0.60);
}
@media (max-width: 1000px) {
  #header h1 { font-size: 54px; }
  #header .english-name { font-size: 30px; letter-spacing: 4px; }
  #header .sub { font-size: 24px; }
  #header .phone { font-size: 22px; }
}
@media (max-width: 600px) {
  #wrap { padding: 12px 14px; }
  #header { padding: 20px 10px 22px; border-radius: 24px; }
  #header h1 { font-size: 40px; white-space: normal; line-height: 1.15; }
  #header .english-name { font-size: 23px; letter-spacing: 2px; margin-bottom: 18px; }
  #header .sub { font-size: 21px; line-height: 1.3; }
  #header .phone { font-size: 18px; letter-spacing: 1px; padding: 8px 12px; }
  #state { font-size: 18px; padding: 11px 10px; }
  .loader { width: 30px; height: 30px; border-width: 4px; }
  .loading-wrapper { gap: 10px; }
  .footer { font-size: 10px; right: 12px; bottom: 8px; }
  body::before { opacity: 0.92; }
}
</style>
</head>
<body>
<div id="wrap">
  <div id="header">
    <h1>HAMDON.COM</h1>
    <div class="english-name">PS4 JAILBREAK</div>
    <div class="sub"><span>Poops Chain Exploit</span></div>
    <div class="neon-line"></div>
    <div class="phone">GoldHEN • Firmware ≥ 12.50</div>
  </div>
  <div id="state">
    <div class="loading-wrapper">
      <div id="loader" class="loader"></div>
      <span id="stateText">
        جارٍ تحميل سلسلة Poops
        <br>
        <small>Please wait... | انتظر قليلاً...</small>
      </span>
      <span class="loader-dots">
        <span></span><span></span><span></span>
      </span>
    </div>
  </div>
  <div id="out-container">
    <div id="out"></div>
  </div>
</div>
<div class="footer">HAMDON.COM • Poops Exploit</div>
<script type="module">
import "./chain_poops.js";
const loader = document.getElementById("loader");
const state = document.getElementById("state");
const stateText = document.getElementById("stateText");
window.poopsDone = function () {
  loader.classList.add("done");
  state.classList.add("done");
  stateText.innerHTML = "اكتملت العملية بنجاح<br><small>Done successfully...</small>";
};
window.poopsError = function () {
  loader.classList.remove("done");
  state.classList.add("error");
  stateText.innerHTML = "حدث خطأ أثناء التنفيذ<br><small>Something went wrong...</small>";
};
</script>
</body>
</html>
