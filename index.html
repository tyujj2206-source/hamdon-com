<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAMDON.COM - PS4 Jailbreak</title>
<style>
html, body { margin:0; padding:0; background:#0b0d10; color:#c8ced8;
             font:15px/1.45 "Segoe UI", system-ui, sans-serif; }
#wrap { padding:16px 18px; }
#state { font-size:22px; font-weight:700; margin:0 0 6px; }
#det { font-size:13px; color:#8b95a3; margin:0 0 4px; }
#det b { color:#c8ced8; font-weight:600; }
#cache { font-size:12px; color:#5c6672; margin:0 0 10px; min-height:14px; }
#cache.cacheok { color:#7fd0a0; }
.ok { color:#7fd0a0; } .bad { color:#d08a7f; } .warn { color:#d8c07f; }
#brand { text-align:center; padding:8px 10px; background:#0e1116;
         border-bottom:1px solid #1e2732; }
#brand img { width:28px; height:28px; margin-right:8px; border-radius:50%;
             vertical-align:middle; }
#brand b { font-size:15px; font-weight:700; letter-spacing:.14em;
           color:#e6ebf2; vertical-align:middle; }
</style>
</head>
<body>
<div id="brand"><img src="logo_raw.png" alt="" width="28" height="28"><b>HAMDON.COM</b></div>
<div id="wrap">
  <div id="state">جارٍ تنزيل الملفات للعمل أوفلاين...</div>
  <div id="det"></div>
  <div id="cache"></div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }
    var bug = null, why = "";
    var forced = params.get("bug");
    if (forced === "lapse" || forced === "poops") {
        bug = forced; why = "forced via ?bug=" + forced;
    } else if (!key) {
        why = "user-agent is not a PlayStation 4";
    } else if (fwnum <= 1202) {
        bug = "lapse"; why = key + " <= 12.02";
    } else if (fwnum >= 1250) {
        bug = "poops"; why = key + " >= 12.50";
    } else {
        why = key + " -- no working bug";
    }
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + " · bug <b>" + (bug || "none") + "</b> · " + why;

    if (!bug) { setState("UNSUPPORTED FIRMWARE", "bad"); return; }

    var target = (bug === "lapse" ? "run_lapse.html" : "PS4_13.00_Webkit.html")
        + location.search;

    function startExploit() {
        setState("جارٍ تحميل " + bug + " chain...", "warn");
        location.replace(target);
    }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    var ac = window.applicationCache;
    
    // إذا لا يوجد AppCache أو المتصفح لا يدعمه
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        setCache("لا يوجد cache - تشغيل مباشر", true);
        setTimeout(startExploit, 1000);
    }
    // إذا أوفلاين والكاش موجود
    else if (!navigator.onLine) {
        setCache("أوفلاين - من الكاش", true);
        setTimeout(startExploit, 1000);
    }
    // إذا الكاش جاهز بالفعل
    else if (ac.status === ac.IDLE) {
        setCache("الكاش جاهز", true);
        setTimeout(startExploit, 1000);
    }
    // إذا هناك تحديث جاهز
    else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("تم تحديث الكاش - اضغط للمتابعة", true);
        waitForTap("تم التحديث - اضغط للبدء", function () { 
            setTimeout(startExploit, 500); 
        });
    }
    // إذا الكاش قيد التنزيل
    else {
        setCache("جارٍ تنزيل الكاش للمرة الأولى...", false);
        
        ac.addEventListener("downloading", function () { 
            setCache(" جارٍ تنزيل الملفات للعمل أوفلاين...", false); 
        }, false);
        
        ac.addEventListener("progress", function (e) {
            if (e && e.total) {
                var pct = Math.round((e.loaded / e.total) * 100);
                setCache("⬇ تنزيل " + pct + "% - " + e.loaded + " / " + e.total + " بايت", false);
            } else if (e && e.loaded) {
                setCache("⬇ تنزيل... " + e.loaded + " بايت", false);
            }
        }, false);
        
        ac.addEventListener("cached", function () {
            setCache("✓ اكتمل تنزيل الكاش - الموقع جاهز للعمل أوفلاين!", true);
            setState("اكتمل التنزيل - جارٍ بدء التهكير...", "ok");
            setTimeout(startExploit, 1500);
        }, false);
        
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("✓ تم تحديث الكاش", true);
            setState("اكتمل التحديث - جارٍ بدء التهكير...", "ok");
            setTimeout(startExploit, 1500);
        }, false);
        
        ac.addEventListener("noupdate", function () {
            setCache("✓ الكاش محدّث وجاهز", true);
            setState("الكاش جاهز - جارٍ بدء التهكير...", "ok");
            setTimeout(startExploit, 1500);
        }, false);
        
        ac.addEventListener("error", function () {
            setCache("⚠ فشل تنزيل الكاش - تشغيل بدون cache", false);
            setState("فشل الكاش - جارٍ المحاولة بدون cache...", "warn");
            setTimeout(startExploit, 2000);
        }, false);
        
        ac.addEventListener("obsolete", function () {
            setCache("⚠ الكاش قديم - جاري التحديث...", false);
            setState("الكاش قديم - جارٍ التحديث...", "warn");
        }, false);
    }
})();
</script>
</body>
</html>
