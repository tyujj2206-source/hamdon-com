<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAMDON.COM | PS4 Jailbreak Host</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Cairo:wght@400;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --neon-green: #00ff88;
  --neon-blue: #00d4ff;
  --neon-purple: #b026ff;
  --dark-bg: #0a0e1a;
  --card-bg: rgba(15, 20, 35, 0.85);
}

html, body {
  min-height: 100vh;
  background: var(--dark-bg);
  color: #e0e8f0;
  font-family: 'Cairo', 'Segoe UI', sans-serif;
  overflow-x: hidden;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(circle at 20% 50%, rgba(0, 255, 136, 0.08) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(0, 212, 255, 0.08) 0%, transparent 50%),
    radial-gradient(circle at 50% 80%, rgba(176, 38, 255, 0.06) 0%, transparent 50%);
  z-index: 0;
  animation: bgPulse 8s ease-in-out infinite alternate;
}

@keyframes bgPulse {
  0% { opacity: 0.6; }
  100% { opacity: 1; }
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: 
    linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
  background-size: 50px 50px;
  z-index: 0;
  pointer-events: none;
}

.scanlines {
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 0, 0, 0.1) 2px,
    rgba(0, 0, 0, 0.1) 4px
  );
  z-index: 1;
  pointer-events: none;
  opacity: 0.3;
}

#container {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.logo-section {
  text-align: center;
  margin-bottom: 40px;
  animation: fadeInDown 1s ease-out;
}

@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-30px); }
  to { opacity: 1; transform: translateY(0); }
}

.logo-img {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 3px solid var(--neon-green);
  box-shadow: 
    0 0 20px rgba(0, 255, 136, 0.5),
    0 0 40px rgba(0, 255, 136, 0.3),
    inset 0 0 20px rgba(0, 255, 136, 0.2);
  margin-bottom: 20px;
  animation: logoGlow 2s ease-in-out infinite alternate;
}

@keyframes logoGlow {
  0% { box-shadow: 0 0 20px rgba(0, 255, 136, 0.5), 0 0 40px rgba(0, 255, 136, 0.3); }
  100% { box-shadow: 0 0 30px rgba(0, 255, 136, 0.8), 0 0 60px rgba(0, 255, 136, 0.5); }
}

.brand-name {
  font-family: 'Orbitron', sans-serif;
  font-size: 48px;
  font-weight: 900;
  background: linear-gradient(135deg, var(--neon-green), var(--neon-blue), var(--neon-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 4px;
  text-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
  animation: textShimmer 3s ease-in-out infinite;
}

@keyframes textShimmer {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.3); }
}

.tagline {
  font-size: 16px;
  color: rgba(224, 232, 240, 0.7);
  margin-top: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.main-card {
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(0, 255, 136, 0.2);
  border-radius: 24px;
  padding: 40px;
  max-width: 700px;
  width: 100%;
  box-shadow: 
    0 20px 60px rgba(0, 0, 0, 0.5),
    0 0 40px rgba(0, 255, 136, 0.1);
  animation: fadeInUp 1s ease-out 0.3s both;
  position: relative;
  overflow: hidden;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

.main-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--neon-green), var(--neon-blue), transparent);
  animation: scanLine 3s linear infinite;
}

@keyframes scanLine {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

.status-box {
  background: rgba(0, 255, 136, 0.05);
  border: 1px solid rgba(0, 255, 136, 0.2);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 24px;
  text-align: center;
}

.status-text {
  font-size: 24px;
  font-weight: 700;
  color: var(--neon-green);
  font-family: 'Orbitron', sans-serif;
  letter-spacing: 1px;
}

.status-text.detecting { color: var(--neon-blue); }
.status-text.success { color: var(--neon-green); }
.status-text.error { color: #ff4466; }
.status-text.warning { color: #ffaa00; }

.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 24px;
}

.info-item {
  background: rgba(0, 212, 255, 0.05);
  border: 1px solid rgba(0, 212, 255, 0.15);
  border-radius: 12px;
  padding: 16px;
  text-align: center;
}

.info-label {
  font-size: 12px;
  color: rgba(224, 232, 240, 0.6);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.info-value {
  font-size: 18px;
  font-weight: 700;
  color: var(--neon-blue);
  font-family: 'Orbitron', sans-serif;
}

.info-value.fw { color: var(--neon-green); }
.info-value.bug { color: var(--neon-purple); }

.cache-status {
  background: rgba(176, 38, 255, 0.05);
  border: 1px solid rgba(176, 38, 255, 0.15);
  border-radius: 12px;
  padding: 16px;
  text-align: center;
  font-size: 14px;
  color: rgba(224, 232, 240, 0.8);
  margin-bottom: 24px;
}

.cache-status.ready {
  background: rgba(0, 255, 136, 0.05);
  border-color: rgba(0, 255, 136, 0.2);
  color: var(--neon-green);
}

.loader-container {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-top: 20px;
}

.loader-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--neon-green);
  animation: dotPulse 1.4s ease-in-out infinite;
  box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
}

.loader-dot:nth-child(2) { animation-delay: 0.2s; background: var(--neon-blue); }
.loader-dot:nth-child(3) { animation-delay: 0.4s; background: var(--neon-purple); }

@keyframes dotPulse {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
  40% { transform: scale(1.2); opacity: 1; }
}

.progress-bar {
  width: 100%;
  height: 4px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 20px;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--neon-green), var(--neon-blue));
  border-radius: 2px;
  animation: progressLoad 2s ease-in-out infinite;
  transform-origin: left;
}

@keyframes progressLoad {
  0% { width: 0%; }
  50% { width: 70%; }
  100% { width: 100%; }
}

.footer {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  color: rgba(224, 232, 240, 0.4);
  letter-spacing: 2px;
  text-transform: uppercase;
  font-family: 'Orbitron', sans-serif;
  z-index: 2;
}

.footer span { color: var(--neon-green); }

@media (max-width: 768px) {
  .brand-name { font-size: 32px; }
  .main-card { padding: 24px; }
  .info-grid { grid-template-columns: 1fr; }
  .status-text { font-size: 20px; }
}

#out-container {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  left: -99999px;
  top: -99999px;
}

#out {
  white-space: pre-wrap;
  font: 12px/1.45 Consolas, monospace;
  background: rgba(0, 0, 0, 0.9);
  border: 1px solid rgba(0, 255, 136, 0.2);
  border-radius: 8px;
  padding: 12px;
  max-height: 300px;
  overflow-y: auto;
  color: var(--neon-green);
}
</style>
</head>
<body>

<div class="scanlines"></div>

<div id="container">
  
  <div class="logo-section">
    <img src="logo_raw.png" alt="HAMDON.COM" class="logo-img">
    <h1 class="brand-name">HAMDON.COM</h1>
    <p class="tagline">PS4 Jailbreak • GoldHEN • 13.xx</p>
  </div>

  <div class="main-card">
    
    <div class="status-box">
      <div id="state" class="status-text detecting">
        جارٍ كشف إصدار النظام...
      </div>
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
    </div>

    <div class="info-grid">
      <div class="info-item">
        <div class="info-label">Firmware</div>
        <div id="fw-value" class="info-value fw">--</div>
      </div>
      <div class="info-item">
        <div class="info-label">Exploit</div>
        <div id="bug-value" class="info-value bug">--</div>
      </div>
    </div>

    <div id="cache" class="cache-status">
      جاري التحقق من التخزين المؤقت...
    </div>

    <div class="loader-container">
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
    </div>

  </div>

</div>

<div class="footer">
  <span>⚡</span> HAMDON.COM <span>⚡</span> PS4 JAILBREAK HOST
</div>

<div id="out-container">
  <div id="out"></div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var fwEl = document.getElementById("fw-value");
    var bugEl = document.getElementById("bug-value");
    var cacheEl = document.getElementById("cache");

    function setState(t, c) { 
        stateEl.textContent = t; 
        stateEl.className = "status-text " + (c || "detecting"); 
    }

    function setCache(t, ok) { 
        cacheEl.textContent = t; 
        cacheEl.className = "cache-status" + (ok ? " ready" : ""); 
    }

    var params = new URLSearchParams(location.search);
    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);

    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var bug = null, why = "";
    var forced = params.get("bug");

    if (forced === "lapse" || forced === "poops") {
        bug = forced;
        why = "forced via ?bug=" + forced;
    } else if (!key) {
        why = "هذا المتصفح ليس PlayStation 4";
        fwEl.textContent = "غير معروف";
        bugEl.textContent = "لا يوجد";
        setState("نسخة غير مدعومة", "error");
        return;
    } else if (fwnum <= 1202) {
        bug = "lapse";
        why = key + " — متوافق (Lapse)";
    } else if (fwnum >= 1250) {
        bug = "poops";
        why = key + " — متوافق (Poops)";
    } else {
        why = key + " — غير مدعوم";
        fwEl.textContent = key;
        bugEl.textContent = "غير مدعوم";
        setState("نسخة غير مدعومة", "error");
        return;
    }

    fwEl.textContent = key || "غير معروف";
    bugEl.textContent = bug ? bug.toUpperCase() : "لا يوجد";

    if (!bug) {
        setState("نسخة غير مدعومة", "error");
        return;
    }

    var target = (bug === "lapse" ? "run_lapse.html" : "PS4_13.00_Webkit.html") + location.search;

    function go() {
        setState("جارٍ تحميل " + bug + "...", "warning");
        location.replace(target);
    }

    function waitForTap(msg, action) {
        setState(msg, "warning");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    var ac = window.applicationCache;

    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("غير متصل — التشغيل من التخزين المؤقت", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("التخزين المؤقت جاهز", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("تم تحميل التحديث", true);
        waitForTap("تحديث جاهز — اضغط للمتابعة", function () { location.reload(); });
    } else {
        setCache("جارٍ التحقق من التخزين المؤقت...");
        ac.addEventListener("downloading", function () { setCache("جارٍ التخزين للمرة الأولى..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total) setCache("تخزين " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("تم التخزين — جاهز للاستخدام دون اتصال", true);
            waitForTap("جاهز — اضغط للتشغيل", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("التحديث جاهز", true);
            waitForTap("تحديث جاهز — اضغط لإعادة التحميل", function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("التخزين المؤقت جاهز", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("فشل التخزين المؤقت");
            waitForTap("فشل التخزين — اضغط للمتابعة", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("التخزين المؤقت قديم");
            waitForTap("التخزين قديم — اضغط للتشغيل", go);
        }, false);
    }
})();
</script>

</body>
</html>
