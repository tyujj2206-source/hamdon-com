<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAMDON.COM | PS4 Jailbreak Host</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Orbitron:wght@700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  min-height: 100vh;
  background: #05070c;
  color: #e8edf5;
  font-family: 'Cairo', system-ui, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

/* خلفية متحركة بالصورة الجديدة */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url('logo_hamdon.png');
  background-size: cover;
  background-position: center;
  opacity: 0.15;
  z-index: 0;
  filter: blur(8px);
  animation: bgPulse 10s ease-in-out infinite alternate;
}
@keyframes bgPulse { 0% { opacity: 0.1; } 100% { opacity: 0.25; } }

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, rgba(0, 255, 136, 0.05), rgba(0, 0, 0, 0.8));
  z-index: 0;
  pointer-events: none;
}

#container {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 600px;
  padding: 20px;
  text-align: center;
}

/* الهيدر والشعار */
#brand {
  margin-bottom: 30px;
  animation: fadeInDown 0.8s ease-out;
}
#brand img { 
  width: 100px; 
  height: 100px; 
  border-radius: 50%; 
  border: 3px solid #00ff88;
  box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
  margin-bottom: 15px;
  object-fit: cover;
}
#brand b {
  display: block;
  font-family: 'Orbitron', sans-serif;
  font-size: 36px;
  letter-spacing: 3px;
  color: #00ff88;
  text-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
}

/* البطاقة الرئيسية */
.card {
  background: rgba(15, 20, 35, 0.85);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  border: 1px solid rgba(0, 255, 136, 0.2);
  border-radius: 24px;
  padding: 30px 25px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
  animation: fadeInUp 0.8s ease-out 0.2s both;
}

#state {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 15px;
  color: #00d4ff;
  min-height: 36px;
}

#det {
  font-size: 15px;
  color: #8b95a3;
  margin-bottom: 20px;
  line-height: 1.6;
  background: rgba(0, 0, 0, 0.3);
  padding: 12px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.05);
}
#det b { color: #00ff88; font-weight: 700; }

#cache {
  font-size: 13px;
  color: #5c6672;
  min-height: 20px;
  margin-top: 10px;
}
#cache.cacheok { color: #00ff88; text-shadow: 0 0 8px rgba(0, 255, 136, 0.5); }

/* ألوان الحالات */
.ok { color: #00ff88 !important; }
.bad { color: #ff4466 !important; }
.warn { color: #ffaa00 !important; }

/* شاشة التحميل (Loader) */
.loader-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-top: 20px;
}
.loader-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #00ff88;
  animation: dotBounce 1.4s infinite ease-in-out both;
}
.loader-dot:nth-child(1) { animation-delay: -0.32s; background: #00d4ff; }
.loader-dot:nth-child(2) { animation-delay: -0.16s; background: #00ff88; }
.loader-dot:nth-child(3) { animation-delay: 0s; background: #b026ff; }

@keyframes dotBounce {
  0%, 80%, 100% { transform: scale(0.5); opacity: 0.4; }
  40% { transform: scale(1.2); opacity: 1; }
}
@keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.footer {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: rgba(255, 255, 255, 0.3);
  letter-spacing: 1px;
  z-index: 2;
}
</style>
</head>
<body>

<div id="container">
  <div id="brand">
    <img src="logo_hamdon.png" alt="HAMDON.COM" width="100" height="100">
    <b>HAMDON.COM</b>
  </div>

  <div class="card">
    <div id="state">جارٍ كشف إصدار النظام...</div>
    <div id="det"></div>
    <div id="cache"></div>
    
    <div class="loader-wrapper">
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
    </div>
  </div>
</div>

<div class="footer">PS4 JAILBREAK HOST • HAMDON.COM</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    
    function setState(t, c) { 
        stateEl.textContent = t; 
        stateEl.className = c || ""; 
    }
    function setCache(t, ok) { 
        cacheEl.textContent = t; 
        cacheEl.className = ok ? "cacheok" : ""; 
    }
    
    var params = new URLSearchParams(location.search);
    var key = null, fwnum = null;
    
    // كشف الإصدار من متصفح PS4
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }
    
    var bug = null, why = "";
    var forced = params.get("bug");
    
    if (forced === "lapse" || forced === "poops") {
        bug = forced; 
        why = "تم التحديد يدوياً: " + forced;
    } else if (!key) {
        why = "هذا المتصفح ليس بلايستيشن 4";
    } else if (fwnum <= 1202) {
        bug = "lapse"; 
        why = key + " — متوافق (Lapse)";
    } else if (fwnum >= 1250) {
        bug = "poops"; 
        why = key + " — متوافق (Poops / 13.xx)";
    } else {
        why = key + " — غير مدعوم حالياً";
    }
    
    detEl.innerHTML = "الإصدار: <b>" + (key || "غير معروف") + "</b><br>"
        + "الثغرة: <b>" + (bug ? bug.toUpperCase() : "لا يوجد") + "</b><br>"
        + "<small style='color:#6b7b8f'>" + why + "</small>";

    if (!bug) { 
        setState("الإصدار غير مدعوم", "bad"); 
        return; 
    }

    // التوجيه للملفات الصحيحة
    var target = (bug === "lapse" ? "run_lapse.html" : "PS4_13.00_Webkit.html") + location.search;
    
    function go() { 
        setState("جارٍ تحميل سلسلة " + bug + "...", "warn");
        setTimeout(function() { location.replace(target); }, 800); 
    }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("غير متصل — التشغيل من الذاكرة المؤقتة", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("التخزين المؤقت جاهز", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("تم تحميل التحديث", true);
        waitForTap("التحديث جاهز — اضغط للمتابعة", function () { location.reload(); });
    } else {
        setCache("جارٍ التحقق من الذاكرة المؤقتة...");
        ac.addEventListener("downloading", function () { setCache("جارٍ التخزين للمرة الأولى..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total) setCache("تخزين " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("تم التخزين — جاهز للاستخدام دون اتصال", true);
            waitForTap("جاهز — اضغط للتشغيل", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("التحديث جاهز", true);
            waitForTap("تحديث جاهز — اضغط لإعادة التحميل", function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("التخزين المؤقت جاهز", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("فشل التخزين المؤقت");
            waitForTap("فشل التخزين — اضغط للمتابعة", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("التخزين المؤقت قديم");
            waitForTap("التخزين قديم — اضغط للتشغيل", go);
        }, false);
    }
})();
</script>
</body>
</html>
