<script>

(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");

    function setState(t, c) { stateEl.innerHTML = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }

    var params = new URLSearchParams(location.search);
    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);

    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var bug = null, why = "";
    var forced = params.get("bug");

    if (forced === "lapse" || forced === "poops") {
        bug = forced;
        why = "تم التحديد يدوياً ?bug=" + forced;
    } else if (!key) {
        why = "هذا المتصفح ليس بلايستيشن 4";
    } else if (fwnum <= 1202) {
        bug = "lapse";
        why = key + " — متوافق (Lapse)";
    } else if (fwnum >= 1250) {
        bug = "poops";
        why = key + " — متوافق (Poops)";
    } else {
        why = key + " — غير مدعوم";
    }

    var fwDisplay = key ? "<b>" + key + "</b>" : "<span style='color:#8f9eb0;'>غير معروف</span>";
    var bugDisplay = bug ? "<span class='chip'>" + bug.toUpperCase() + "</span>" : "<span style='color:#8f9eb0;'>لا يوجد</span>";

    detEl.innerHTML = "النظام " + fwDisplay + " &nbsp;•&nbsp; " + "الثغرة " + bugDisplay + " &nbsp;•&nbsp; " + why;

    if (!bug) {
        setState("نسخة غير مدعومة", "bad");
        return;
    }

    var target = (bug === "lapse" ? "run_lapse.html" : "run_poops.html") + location.search;

    function go() {
        setState("جارٍ تحميل " + bug + " ...", "warn");
        location.replace(target);
    }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    var ac = window.applicationCache;

    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("غير متصل — التشغيل من التخزين المؤقت", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("التخزين المؤقت جاهز", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("تم تحميل التحديث", true);
        waitForTap("تحديث جاهز — اضغط للتحديث والتشغيل", function () { location.reload(); });
    } else {
        setCache("جارٍ التحقق من التخزين المؤقت...");
        ac.addEventListener("downloading", function () { setCache("التخزين المؤقت للمرة الأولى..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total) setCache("تخزين " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("تم التخزين المؤقت — جاهز للاستخدام دون اتصال", true);
            waitForTap("جاهز — اضغط للتشغيل", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("التحديث جاهز", true);
            waitForTap("تحديث جاهز — اضغط لإعادة التحميل", function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("التخزين المؤقت جاهز", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("فشل التخزين المؤقت");
            waitForTap("فشل التخزين — اضغط للتشغيل رغم ذلك", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("التخزين المؤقت قديم");
            waitForTap("التخزين قديم — اضغط للتشغيل", go);
        }, false);
    }
})();

</script>
