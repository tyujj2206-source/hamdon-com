<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAMDON.COM - PS4 Jailbreak 13.xx</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  min-height: 100vh;
  background: #05070c;
  color: #e8edf5;
  font: 18px/1.6 "Segoe UI", "Tahoma", system-ui, -apple-system, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url('preview.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  opacity: 0.88;
  z-index: 0;
  filter: brightness(0.62) contrast(1.08);
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, rgba(0, 255, 136, 0.08), rgba(0, 0, 0, 0.58));
  z-index: 0;
  pointer-events: none;
}

#container {
  width: 100%;
  max-width: 920px;
  padding: 38px 34px 42px;
  margin: 20px;
  background: rgba(10, 15, 24, 0.80);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  border-radius: 42px;
  border: 1px solid rgba(0, 255, 136, 0.18);
  box-shadow: 0 30px 70px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 0 60px rgba(0, 255, 136, 0.08);
  text-align: center;
  position: relative;
  z-index: 1;
}

#main-header {
  margin-bottom: 32px;
  padding-bottom: 22px;
  border-bottom: 1px solid rgba(0, 255, 136, 0.15);
}

#main-header h1 {
  font-size: 50px;
  line-height: 1.2;
  font-weight: 850;
  color: #d9ecff;
  margin-bottom: 12px;
  letter-spacing: 0;
  text-shadow: 0 0 5px rgba(0, 255, 136, 0.95), 0 0 14px rgba(0, 255, 136, 0.95), 0 0 30px rgba(0, 255, 136, 0.85), 0 0 60px rgba(0, 255, 136, 0.55);
  animation: titleGlow 2.8s ease-in-out infinite alternate;
}

@keyframes titleGlow {
  from { text-shadow: 0 0 5px rgba(0, 255, 136, 0.75), 0 0 14px rgba(0, 255, 136, 0.70), 0 0 28px rgba(0, 255, 136, 0.60); }
  to { text-shadow: 0 0 8px rgba(0, 255, 136, 1), 0 0 20px rgba(0, 255, 136, 1), 0 0 40px rgba(0, 255, 136, 0.90), 0 0 70px rgba(0, 255, 136, 0.65); }
}

#main-header .sub {
  font-size: 19px;
  color: #9ebce0;
  letter-spacing: 0.8px;
  font-weight: 500;
  text-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
}

#main-header .sub span {
  color: #c5e0ff;
  font-weight: 700;
  text-shadow: 0 0 8px rgba(0, 255, 136, 0.7);
}

.card {
  background: rgba(7, 11, 18, 0.72);
  border-radius: 34px;
  padding: 34px 26px 30px;
  margin: 10px 0 18px;
  border: 1px solid rgba(0, 255, 136, 0.14);
  box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.55), 0 10px 40px rgba(0, 0, 0, 0.45), 0 0 35px rgba(0, 255, 136, 0.05);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

#state {
  font-size: 22px;
  font-weight: 700;
  margin: 0 0 6px;
}

#det {
  font-size: 13px;
  color: #8b95a3;
  margin: 0 0 4px;
}

#det b {
  color: #c8ced8;
  font-weight: 600;
}

#cache {
  font-size: 12px;
  color: #5c6672;
  margin: 0 0 10px;
  min-height: 14px;
}

#cache.cacheok {
  color: #00ff88;
}

.ok {
  color: #00ff88;
}

.bad {
  color: #d08a7f;
}

.warn {
  color: #d8c07f;
}

#brand {
  text-align: center;
  padding: 8px 10px;
  background: #0e1116;
  border-bottom: 1px solid #1e2732;
}

#brand img {
  width: 28px;
  height: 28px;
  margin-right: 8px;
  border-radius: 50%;
  vertical-align: middle;
}

#brand b {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: .14em;
  color: #e6ebf2;
  vertical-align: middle;
}

.footer-brand {
  position: fixed;
  bottom: 16px;
  right: 24px;
  z-index: 2;
  font-size: 13px;
  color: rgba(0, 255, 136, 0.42);
  letter-spacing: 0.8px;
  font-weight: 500;
  text-transform: uppercase;
  text-shadow: 0 0 10px rgba(0, 255, 136, 0.35);
}

@media (max-width: 600px) {
  #container {
    padding: 26px 18px 32px;
    margin: 12px;
    border-radius: 30px;
  }
  #main-header h1 {
    font-size: 38px;
  }
  #main-header .sub {
    font-size: 16px;
  }
  .card {
    padding: 24px 15px 24px;
    border-radius: 26px;
  }
  #state {
    font-size: 24px;
  }
  #det {
    font-size: 17px;
  }
  #cache {
    font-size: 16px;
  }
}
</style>
</head>
<body>

<div id="brand">
  <img src="logo_raw.png" alt="" width="28" height="28">
  <b>HAMDON.COM</b>
</div>

<div id="container">
  <div id="main-header">
    <h1>HAMDON.COM</h1>
    <div class="sub">
      <span>PS4</span> • Jailbreak GoldHEN 13.xx
    </div>
  </div>

  <div class="card">
    <div id="state">جارٍ كشف النسخة...</div>
    <div id="det"></div>
    <div id="cache"></div>
  </div>
</div>

<div class="footer-brand">HAMDON PS4 TOOL</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }
    var bug = null, why = "";
    var forced = params.get("bug");
    if (forced === "lapse" || forced === "poops") {
        bug = forced; why = "forced via ?bug=" + forced;
    } else if (!key) {
        why = "user-agent is not a PlayStation 4";
    } else if (fwnum <= 1202) {
        bug = "lapse"; why = key + " <= 12.02";
    } else if (fwnum >= 1250) {
        bug = "poops"; why = key + " >= 12.50";
    } else {
        why = key + " -- no working bug (lapse ends at 12.02, poops needs 12.50)";
    }
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + " · bug <b>" + (bug || "none") + "</b> · " + why;

    if (!bug) { setState("UNSUPPORTED FIRMWARE", "bad"); return; }

    var target = (bug === "lapse" ? "run_lapse.html" : "PS4_13.00_Webkit.html")
        + location.search;
    function go() { setState("loading " + bug + " chain...", "warn");
                    location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);

        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run",
                       function () { location.reload(); });
        }, false);

        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
</body>
</html>
