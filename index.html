        html, body {

            background:#0b0d10;

        }
        
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0d10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        #loadingScreen.hidden {
            display: none;
        }
        
        #loadingScreen img { 
            width: 200px; 
            height: 200px; 
            border-radius: 50%;
            margin-bottom: 30px;
            border: 3px solid #1e2732;
            box-shadow: 0 0 30px rgba(127, 208, 160, 0.3);
        }
        
        #loadingText {
            font-size: 24px;
            font-weight: 700;
            color: #7fd0a0;
            margin-bottom: 20px;
            text-align: center;
        }
        
        #loadingProgress {
            font-size: 14px;
            color: #8b95a3;
            text-align: center;
        }
        
        #loadingDots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

            display: none;
        }
