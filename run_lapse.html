<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAMDON.COM - Lapse Chain</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  min-height: 100vh;
  background: #05070c;
  color: #e8edf5;
  font: 18px/1.6 "Segoe UI", "Tahoma", system-ui, -apple-system, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url('preview.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  opacity: 0.88;
  z-index: 0;
  filter: brightness(0.62) contrast(1.08);
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, rgba(0, 255, 136, 0.08), rgba(0, 0, 0, 0.58));
  z-index: 0;
  pointer-events: none;
}

#wrap {
  padding: 16px 18px;
  position: relative;
  z-index: 1;
}

#state {
  font-size: 22px;
  font-weight: 700;
  margin: 0 0 6px;
  text-align: center;
}

#det {
  font-size: 13px;
  color: #8b95a3;
  margin: 0 0 4px;
  text-align: center;
}

#det b {
  color: #c8ced8;
  font-weight: 600;
}

#cache {
  font-size: 12px;
  color: #5c6672;
  margin: 0 0 10px;
  min-height: 14px;
  text-align: center;
}

#cache.cacheok {
  color: #00ff88;
}

.ok {
  color: #00ff88;
}

.bad {
  color: #d08a7f;
}

.warn {
  color: #d8c07f;
}

#brand {
  text-align: center;
  padding: 8px 10px;
  background: #0e1116;
  border-bottom: 1px solid #1e2732;
}

#brand img {
  width: 28px;
  height: 28px;
  margin-right: 8px;
  border-radius: 50%;
  vertical-align: middle;
}

#brand b {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: .14em;
  color: #e6ebf2;
  vertical-align: middle;
}

.footer-brand {
  position: fixed;
  bottom: 16px;
  right: 24px;
  z-index: 2;
  font-size: 13px;
  color: rgba(0, 255, 136, 0.42);
  letter-spacing: 0.8px;
  font-weight: 500;
  text-transform: uppercase;
  text-shadow: 0 0 10px rgba(0, 255, 136, 0.35);
}

@media (max-width: 600px) {
  #wrap {
    padding: 12px 14px;
  }
  #state {
    font-size: 18px;
  }
  #det {
    font-size: 11px;
  }
  #cache {
    font-size: 10px;
  }
}
</style>
</head>
<body>

<div id="brand">
  <img src="logo_raw.png" alt="" width="28" height="28">
  <b>HAMDON.COM</b>
</div>

<div id="wrap">
  <div id="state">loading lapse chain...</div>
  <div id="det"></div>
  <div id="cache"></div>
</div>

<div class="footer-brand">HAMDON LAPSE</div>

<script type="module">
import "./chain_lapse.js";
</script>
</body>
</html>
